services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  p1-qkd-on:
    build:
      context: .
      args:
        APP_DIR: servers/p1
    env_file: .env.p1
    environment:
      REDIS_URL: redis://redis:6379/0
      QKD_SIMULATION_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "8001:8000"

  p2-qkd-on:
    build:
      context: .
      args:
        APP_DIR: servers/p2
    env_file: .env.p2
    environment:
      P1_URL: http://p1-qkd-on:8000
      QKD_SIMULATION_ENABLED: "true"
    depends_on:
      p1-qkd-on:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "8002:8000"

  p1-qkd-off:
    build:
      context: .
      args:
        APP_DIR: servers/p1
    env_file: .env.p1
    environment:
      REDIS_URL: redis://redis:6379/1
      QKD_SIMULATION_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "8003:8000"

  p2-qkd-off:
    build:
      context: .
      args:
        APP_DIR: servers/p2
    env_file: .env.p2
    environment:
      P1_URL: http://p1-qkd-off:8000
      QKD_SIMULATION_ENABLED: "false"
    depends_on:
      p1-qkd-off:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    ports:
      - "8004:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      p1-qkd-on:
        condition: service_healthy
      p2-qkd-on:
        condition: service_healthy
      p1-qkd-off:
        condition: service_healthy
      p2-qkd-off:
        condition: service_healthy
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_P1_URL: http://localhost:8001
        VITE_P2_URL: http://localhost:8002
    depends_on:
      p1-qkd-on:
        condition: service_healthy
      p2-qkd-on:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
