global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: p1-qkd-on
    static_configs:
      - targets: [p1-qkd-on:8000]

  - job_name: p2-qkd-on
    static_configs:
      - targets: [p2-qkd-on:8000]

  - job_name: p1-qkd-off
    static_configs:
      - targets: [p1-qkd-off:8000]

  - job_name: p2-qkd-off
    static_configs:
      - targets: [p2-qkd-off:8000]
